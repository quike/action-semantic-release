name: Push

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: read-all

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-26.04
    name: Release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Dependencies
        id: npm-ci
        run: npm ci
      - name: Check Format
        id: npm-format-check
        run: npm run format:check
      - name: Lint
        id: npm-lint
        run: npm run lint
      - name: Use local Dockerfile for action under test
        run: |
          echo "Swap action.yml to local Dockerfile so the release runs against current source."
          sed -i "s|^  image: .*|  image: 'Dockerfile'|" ./action.yml
          grep -x "  image: 'Dockerfile'" ./action.yml
      - name: Compute next version
        id: next
        uses: ./
        with:
          dry-run: true
          default-config: true
          add-summary: false
        env:
          GITHUB_TOKEN: ${{ secrets.GHTOKEN }}
      - name: Set up QEMU
        if: ${{ github.event_name == 'push' && steps.next.outputs.release-version != '' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        if: ${{ github.event_name == 'push' && steps.next.outputs.release-version != '' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to the Container registry
        if: ${{ github.event_name == 'push' && steps.next.outputs.release-version != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        if: ${{ github.event_name == 'push' && steps.next.outputs.release-version != '' }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.next.outputs.release-version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.next.outputs.release-version }}
            type=semver,pattern={{major}},value=${{ steps.next.outputs.release-version }}
      - name: Build and push release image
        if: ${{ github.event_name == 'push' && steps.next.outputs.release-version != '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Release
        id: release
        uses: ./
        with:
          debug-mode: true
          dry-run: false
          default-config: true
          floating-tags: true
          add-summary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GHTOKEN }}
          EXPECTED_VERSION: ${{ steps.next.outputs.release-version }}
      - name: Get the output
        run: |
          echo "release-published: ${{ steps.release.outputs.release-published }}"
          echo "release-git-head: ${{ steps.release.outputs.release-version }}"
          echo "release-major: ${{ steps.release.outputs.release-major }}"
          echo "release-minor: ${{ steps.release.outputs.release-minor }}"
          echo "release-patch: ${{ steps.release.outputs.release-patch }}"
          echo "release-type: ${{ steps.release.outputs.release-type }}"
          echo "release-git-head: ${{ steps.release.outputs.release-git-head }}"
          echo "release-git-tag: ${{ steps.release.outputs.release-git-tag }}"
